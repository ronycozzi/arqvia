name: Production release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqvia-production-release-check
  cancel-in-progress: false

jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arqvia_release_test
          POSTGRES_PASSWORD: arqvia
          POSTGRES_USER: arqvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arqvia -d arqvia_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARQVIA_ALLOW_PRODUCTION_SEED: "true"
      AUTH_SECRET: release-verification-secret-with-more-than-32-characters
      AUTH_URL: http://localhost:3100
      DATABASE_URL: postgresql://arqvia:arqvia@localhost:5432/arqvia_release_test
      NEXT_PUBLIC_ANALYTICS_PROVIDER: none
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_WHATSAPP_MESSAGE: Hola, quiero consultar por un proyecto.
      NEXT_PUBLIC_WHATSAPP_NUMBER: "5493517778899"
      ADMIN_EMAIL: ci-release-admin@arqvia.test
      ADMIN_PASSWORD: ci-release-admin-password
      RATE_LIMIT_STORE: database
      TRUST_PROXY_PROVIDER: vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan repository for committed secrets
        run: npm run security:scan

      - name: Deploy migrations to ephemeral PostgreSQL
        run: npm run db:postgres:deploy

      - name: Seed ephemeral verification database
        run: npx prisma db seed --schema prisma/postgresql/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests against ephemeral PostgreSQL
        run: npm run test

      - name: Build release artifact
        run: npm run build:postgres

      - name: Production dependency audit (high and critical)
        run: npm run audit:production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E desktop tests
        run: npm run e2e -- --project=chromium --workers=1

      - name: E2E mobile tests
        run: npm run e2e -- --project=mobile --workers=1

      - name: Verify E2E fixture cleanup
        run: npm run test:e2e-residue

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-check:
    needs: verify-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ARQVIA_STRICT_PUBLIC_URL: "true"
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ vars.AUTH_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MEDIA_STORAGE_PROVIDER: s3
      NEXT_PUBLIC_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
      NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_WHATSAPP_MESSAGE: ${{ vars.NEXT_PUBLIC_WHATSAPP_MESSAGE }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      RATE_LIMIT_STORE: database
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TRUST_PROXY_PROVIDER: ${{ vars.TRUST_PROXY_PROVIDER }}
      LEAD_AUTOMATION_ENABLED: ${{ vars.LEAD_AUTOMATION_ENABLED }}
      LEAD_AUTOMATION_CAPTURE_ENABLED: ${{ vars.LEAD_AUTOMATION_CAPTURE_ENABLED }}
      LEAD_WEBHOOK_URL: ${{ vars.LEAD_WEBHOOK_URL }}
      LEAD_WEBHOOK_ALLOWED_HOSTS: ${{ vars.LEAD_WEBHOOK_ALLOWED_HOSTS }}
      LEAD_WEBHOOK_SECRET: ${{ secrets.LEAD_WEBHOOK_SECRET }}
      AUTOMATION_CRON_SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
      LEAD_RETENTION_ENABLED: ${{ vars.LEAD_RETENTION_ENABLED }}
      LEAD_RETENTION_DAYS: ${{ vars.LEAD_RETENTION_DAYS }}
      LEAD_RETENTION_BATCH_SIZE: ${{ vars.LEAD_RETENTION_BATCH_SIZE }}
      DATA_RETENTION_CRON_SECRET: ${{ secrets.DATA_RETENTION_CRON_SECRET }}
      PRIVATE_OBJECT_DELETION_CRON_SECRET: ${{ secrets.PRIVATE_OBJECT_DELETION_CRON_SECRET }}
      ARQVIA_AUTOMATION_APPROVED_BY: ${{ vars.ARQVIA_AUTOMATION_APPROVED_BY }}
      ARQVIA_AUTOMATION_APPROVED_AT: ${{ vars.ARQVIA_AUTOMATION_APPROVED_AT }}
      ARQVIA_RETENTION_APPROVED_BY: ${{ vars.ARQVIA_RETENTION_APPROVED_BY }}
      ARQVIA_RETENTION_APPROVED_AT: ${{ vars.ARQVIA_RETENTION_APPROVED_AT }}
      ARQVIA_CONTENT_APPROVED_BY: ${{ vars.ARQVIA_CONTENT_APPROVED_BY }}
      ARQVIA_CONTENT_APPROVED_AT: ${{ vars.ARQVIA_CONTENT_APPROVED_AT }}
      ARQVIA_MEDIA_RIGHTS_APPROVED_BY: ${{ vars.ARQVIA_MEDIA_RIGHTS_APPROVED_BY }}
      ARQVIA_MEDIA_RIGHTS_APPROVED_AT: ${{ vars.ARQVIA_MEDIA_RIGHTS_APPROVED_AT }}
      ARQVIA_STORAGE_APPROVED_BY: ${{ vars.ARQVIA_STORAGE_APPROVED_BY }}
      ARQVIA_STORAGE_APPROVED_AT: ${{ vars.ARQVIA_STORAGE_APPROVED_AT }}
      ARQVIA_CONTACT_APPROVED_BY: ${{ vars.ARQVIA_CONTACT_APPROVED_BY }}
      ARQVIA_CONTACT_APPROVED_AT: ${{ vars.ARQVIA_CONTACT_APPROVED_AT }}
      ARQVIA_LEGAL_APPROVED_BY: ${{ vars.ARQVIA_LEGAL_APPROVED_BY }}
      ARQVIA_LEGAL_APPROVED_AT: ${{ vars.ARQVIA_LEGAL_APPROVED_AT }}
      ARQVIA_ESTIMATOR_APPROVED_BY: ${{ vars.ARQVIA_ESTIMATOR_APPROVED_BY }}
      ARQVIA_ESTIMATOR_APPROVED_AT: ${{ vars.ARQVIA_ESTIMATOR_APPROVED_AT }}
      ARQVIA_ESTIMATOR_APPROVED_VERSION: ${{ vars.ARQVIA_ESTIMATOR_APPROVED_VERSION }}
      ARQVIA_BACKUP_RESTORE_APPROVED_BY: ${{ vars.ARQVIA_BACKUP_RESTORE_APPROVED_BY }}
      ARQVIA_BACKUP_RESTORE_APPROVED_AT: ${{ vars.ARQVIA_BACKUP_RESTORE_APPROVED_AT }}
      ARQVIA_PWA_APPROVED_BY: ${{ vars.ARQVIA_PWA_APPROVED_BY }}
      ARQVIA_PWA_APPROVED_AT: ${{ vars.ARQVIA_PWA_APPROVED_AT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production environment contract
        run: npm run release:env

      - name: Scan repository for committed secrets
        run: npm run security:scan

      - name: Generate PostgreSQL client
        run: npm run db:postgres:generate

      - name: Verify production migration state without writing
        run: npx prisma migrate status --schema prisma/postgresql/schema.prisma

      - name: Run read-only deterministic production gate
        run: npm run release:check

      - name: Build source-bound production artifact from current state
        run: npm run build:release

      - name: Upload production release receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-release-receipt-${{ github.sha }}
          path: .next/release-gate.json
          if-no-files-found: error
          retention-days: 30
