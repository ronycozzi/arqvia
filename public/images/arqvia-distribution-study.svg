<path d="M908 201V145L899 165M908 145L917 165" stroke="#29362e" stroke-width="1.5"/><text x="904" y="135" fill="#29362e" font-family="Arial,sans-serif" font-size="11">N</text>
<path d="M58 701H942" stroke="#bdb9ab"/><text x="58" y="726" fill="#777b70" font-family="Arial,sans-serif" font-size="10">PLANTA DE ESTUDIO · SIN ESCALA · NO APTO PARA EJECUCIÓN</text><text x="835" y="726" fill="#303a33" font-family="Arial,sans-serif" font-size="14" font-weight="700">ARQVIA</text>
