<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" fill="none">
<title>Estudio conceptual de una vivienda con patio</title>
<desc>Planta ilustrativa de distribución con dormitorios, estar, comedor, cocina, baño, galería y patio. No es documentación ejecutiva de una obra.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#b9b5a6" stroke-width=".35"/></pattern><pattern id="deck" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0V12" stroke="#b8ab8e" stroke-width=".8"/></pattern><pattern id="tile" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#aaa99e" stroke-width=".6"/></pattern></defs>
<rect width="1000" height="780" fill="#f3f0e8"/><rect x="32" y="28" width="936" height="724" stroke="#bdb9ab" stroke-width="1"/>
<text x="58" y="61" fill="#303a33" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">ARQVIA / ESTUDIO DE DISTRIBUCIÓN</text><text x="58" y="83" fill="#777b70" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">VIVIENDA CON PATIO · EXPLORACIÓN CONCEPTUAL</text><path d="M58 100H942" stroke="#bdb9ab"/>
