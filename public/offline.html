<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24251f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión | Arqvia</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #171812;
        color: #f6f1e8;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-color: #171812;
        background-image:
          linear-gradient(rgba(246, 241, 232, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(246, 241, 232, 0.035) 1px, transparent 1px);
        background-size: 88px 88px;
      }
      main {
        width: min(760px, 100%);
        border: 1px solid rgba(246, 241, 232, 0.16);
        background: #24251f;
        padding: clamp(32px, 8vw, 72px);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.34);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #f6f1e8;
        text-decoration: none;
      }
      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid #b4824a;
        font-size: 14px;
        font-weight: 700;
      }
      .name { font-family: Georgia, "Times New Roman", serif; font-size: 28px; }
      .eyebrow {
        margin: 56px 0 0;
        color: #d6a968;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 620px;
        margin: 14px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 8vw, 72px);
        font-weight: 400;
        line-height: 0.98;
      }
      p {
        max-width: 570px;
        margin: 24px 0 0;
        color: rgba(246, 241, 232, 0.74);
        font-size: 17px;
        line-height: 1.7;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
      .status {
        min-height: 24px;
        margin-top: 16px;
        color: #d6a968;
        font-size: 14px;
      }
      .actions form { margin: 0; }
      button, a.button {
        min-height: 50px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(246, 241, 232, 0.22);
        padding: 0 22px;
        color: #f6f1e8;
        background: transparent;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button { border-color: #b4824a; background: #b4824a; }
      button:disabled { cursor: wait; opacity: 0.72; }
      button:focus-visible, a:focus-visible { outline: 2px solid #f6f1e8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Arqvia, volver al inicio">
        <span class="mark" aria-hidden="true">AV</span>
        <span class="name">Arqvia</span>
      </a>
      <p class="eyebrow">Conexión interrumpida</p>
      <h1>Volvamos a conectar.</h1>
      <p>
        El sitio no pudo responder en este momento. Puede ser una interrupción
        breve de internet o del servidor; conservamos esta pantalla mientras
        restablecemos el acceso.
      </p>
      <p class="status" role="status" aria-live="polite" data-recovery-status>
        Reintentaremos automáticamente cuando vuelva la conexión.
      </p>
      <div class="actions">
        <form method="get" action="">
          <button type="submit" data-retry-button>Reintentar ahora</button>
        </form>
        <a class="button" href="/">Volver al inicio</a>
      </div>
    </main>
    <script src="/offline-recovery.js" defer></script>
  </body>
</html>
